# ============================================================
# ResumeCraft — Docker Compose (local testing with MySQL)
# ============================================================
# NOTE: This file is for LOCAL testing if you later want to test
#       with Docker Desktop. It is NOT needed for Railway deployment.

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: resumecraft-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: resumecraft_db
    ports:
      - "3307:3306"
    volumes:
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: resumecraft-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_URL: jdbc:mysql://db:3306/resumecraft_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
    depends_on:
      - db

volumes:
  mysql_data:
